<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Statements</title>
</head>
<body>
    <script>
        let a=10;
        let b=12;
        if (b>a)
            document.write("True ");
        if(a%2==b%2)
            document.write(" true");
        if(a==b)
            document.write("True");
        if(a<b)
            document.write("True");
        
    </script>
</body>
</html>
