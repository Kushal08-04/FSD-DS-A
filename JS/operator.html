<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator</title>
</head>
<body>
    <script>
        let a=10;
        let b=2;
        let c=a+b;
        document.write("The value of sum is: "+c);
        c=a-b;
        document.write("The value of minus is: "+c);
        c=a*b;
        document.write("The value of product is: "+c);
        c=a/b;
        document.write("The value of division is: "+c);
    </script>
</body>
</html>
