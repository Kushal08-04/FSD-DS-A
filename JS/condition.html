<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Statements</title>
</head>
<body>
    <script>
       let num=prompt("Enter a number : ");
       let temp=num;
       let count=0;
       while(temp>0)
       {
            temp=Math.floor(temp/10);
            count++;
       }
        let sum=0;
        for(let n=1;n<=count;n++)
        {
            let r=num%10;
            sum+=(r*r*r);
            num=Math.floor(num/10);
        }
        if(sum==153)
            document.write("\nTrue, Armstrong number");
        else
            document.write("\nFalse, not Armstrong number");
    </script>
</body>
</html>
